<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wifi zone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header><div class="brand" id="brand">Wifi zone</div></header>
  <div id="error" class="panel" hidden></div>
  <main id="main" hidden>
    <h1>Choisissez votre durée de connexion</h1>
    <p class="sub">Payez par Mobile Money, recevez votre code, connectez-vous au wifi.</p>

    <div id="routerBox" hidden>
      <label for="router">Point wifi</label>
      <select id="router"></select>
      <div style="height:14px"></div>
    </div>

    <div class="grid" id="plans" role="radiogroup" aria-label="Forfaits"></div>

    <h2>Paiement</h2>
    <div id="manualBox" class="panel" style="margin-top:0"></div>
    <div class="row">
      <div><label for="phone">Votre numéro de téléphone</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ex. 07 00 00 00 00"></div>
      <button class="btn" id="pay">J'ai payé : demander mon code</button>
    </div>
    <div class="msg" id="payMsg" role="status"></div>
    <div id="result"></div>
  </main>
</div>
<div id="toast" role="status"></div>
<script type="module" src="portal.js"></script>
</body>
</html>
